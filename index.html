<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Traço Falso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: uma coluna central estilo caderno quadriculado; cada tela é uma folha, o papel de desenho é sempre claro */
:root {
  --bg: #eef2f7; --grid: #dbe3ee; --surface: #ffffff; --ink: #18212f; --muted: #5b6676;
  --line: #ccd5e1; --accent: #ff4f2e; --accent-ink: #ffffff; --danger: #c2261b; --good: #1f8a4c;
  --f-display: "Bagel Fat One", "Arial Black", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 14px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121823; --grid: #1b2433; --surface: #1a2230; --ink: #edf1f7; --muted: #9aa6b8;
    --line: #2d3949; --accent: #ff6a4d; --accent-ink: #1a0d08; --danger: #ff7b70; --good: #5fd18f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; min-height: 100vh;
}
.wrap {
  max-width: 620px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; margin: 0; }
.logo span { color: var(--accent); }
.tag { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.banner { background: var(--danger); color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 14px; }
.sheet { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.15; margin: 0; text-wrap: balance; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; cursor: pointer; }
.btn { border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 12px 20px; font-weight: 700; font-size: 16px; transition: transform .08s ease; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.wide { width: 100%; }
.btn.small { padding: 6px 14px; font-size: 14px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { border-color: var(--line); font-weight: 500; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.field { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); }
.field:focus { outline: none; border-color: var(--accent); }
.field.code { font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .3em; text-align: center; font-size: 24px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1.5px dashed var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.dot { width: 18px; height: 18px; border-radius: 50%; flex: none; border: 2px solid rgba(0,0,0,.12); display: inline-block; }
.plist { display: flex; flex-direction: column; }
.prow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); min-width: 0; }
.prow .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.prow .st { font-size: 12px; font-family: var(--f-mono); color: var(--muted); }
.prow.off .n, .prow.off .dot { opacity: .4; }
.x { border: none; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 8px; border-radius: 8px; }
.x:hover { color: var(--danger); }
.code-big { font-family: var(--f-mono); font-size: clamp(40px, 13vw, 64px); letter-spacing: .2em; line-height: 1; text-align: center; padding-left: .2em; }
.link { font-family: var(--f-mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; text-align: center; user-select: all; }
details { border-top: 1.5px dashed var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 700; }
details ol { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.card { width: 100%; border-radius: var(--r); padding: 28px 20px; text-align: center; border: 2px dashed var(--line); display: flex; flex-direction: column; gap: 8px; align-items: center; background: transparent; color: var(--ink); }
.card .word { font-family: var(--f-display); font-size: clamp(32px, 9vw, 48px); line-height: 1.1; overflow-wrap: anywhere; }
.card.imp { border-color: var(--danger); border-style: solid; }
.card.imp .word { color: var(--danger); }
.card.compact { padding: 12px; }
.card.compact .word { font-size: 26px; }
.turn { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; min-width: 0; }
.who .dot { width: 24px; height: 24px; }
.mono { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.canvas-box { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--line); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
canvas.mine { cursor: crosshair; }
.hint { position: absolute; inset: auto 0 12px; text-align: center; font-size: 13px; color: #5b6676; pointer-events: none; }
.order { display: flex; flex-wrap: wrap; gap: 6px; }
.order span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px 3px 6px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--muted); }
.order span.now { color: var(--ink); border-color: var(--ink); font-weight: 700; }
.order span.ok { color: var(--ink); }
.order .dot { width: 12px; height: 12px; border-width: 1px; }
.vote-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.vote-list button { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font-weight: 700; text-align: left; min-width: 0; }
.vote-list button .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vote-list button:hover { border-color: var(--ink); }
.verdict { font-family: var(--f-display); font-size: clamp(30px, 8vw, 44px); line-height: 1.1; text-wrap: balance; }
.verdict.win-imp { color: var(--danger); }
.verdict.win-art { color: var(--good); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
td { padding: 8px 4px; border-bottom: 1px dashed var(--line); }
td.pts { text-align: right; font-family: var(--f-mono); }
.tally { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.wait { text-align: center; color: var(--muted); padding: 6px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="logo">Traço<span>Falso</span></h1>
    <span class="tag" id="status">Cada um no seu celular</span>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
/* ================= Dados ================= */
const WORDS = {
  "Animais": ["Girafa","Polvo","Tartaruga","Pinguim","Elefante","Cobra","Coruja","Caranguejo","Tubarão","Borboleta","Canguru","Jacaré","Morcego","Caracol","Flamingo","Camelo","Baleia","Galinha","Aranha","Tucano"],
  "Comidas": ["Pizza","Coxinha","Pastel","Melancia","Brigadeiro","Sorvete","Hambúrguer","Pão de queijo","Cachorro-quente","Banana","Abacaxi","Pipoca","Bolo de aniversário","Ovo frito","Sushi","Espiga de milho","Açaí","Tapioca","Cenoura","Uva"],
  "Objetos": ["Guarda-chuva","Tesoura","Óculos","Relógio","Violão","Lâmpada","Escada","Bicicleta","Chave","Vassoura","Ventilador","Mochila","Martelo","Cadeira","Telefone","Vela","Bule","Câmera","Pente","Ampulheta"],
  "Lugares": ["Praia","Farol","Castelo","Hospital","Escola","Igreja","Circo","Fazenda","Aeroporto","Vulcão","Ilha","Pirâmide","Cachoeira","Estádio","Biblioteca","Supermercado","Deserto","Iglu","Parque de diversões","Posto de gasolina"],
  "Profissões": ["Bombeiro","Astronauta","Chef de cozinha","Dentista","Pirata","Mágico","Palhaço","Policial","Pintor","Pescador","Médico","Jardineiro","Cientista","Detetive","Carteiro","Professor","Piloto","Mergulhador","Cabeleireiro","Fotógrafo"],
  "Esportes e lazer": ["Futebol","Surfe","Basquete","Pescaria","Xadrez","Boliche","Natação","Skate","Tênis","Golfe","Karatê","Esqui","Pipa","Videogame","Acampamento","Balé","Boxe","Vôlei","Ciclismo","Paraquedas"],
  "Natureza": ["Arco-íris","Tornado","Cacto","Cogumelo","Lua","Sol","Montanha","Raio","Floresta","Girassol","Árvore","Estrela cadente","Onda","Nuvem","Rosa","Folha","Pedra","Neve","Planeta","Coqueiro"]
};
const CATS = ["Aleatória", ...Object.keys(WORDS)];
const COLORS = ["#e63946","#1d7fd6","#2a9d55","#f08c00","#8e44ad","#e0559b","#0fa3a3","#7a5230","#4b5563","#c9a400"];
const PREFIX = "tracofalso-v1-";
const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

/* ================= Utilidades ================= */
const $ = id => document.getElementById(id);
const app = $("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const dot = c => `<span class="dot" style="background:${c}"></span>`;
const rid = n => { let s = ""; const b = crypto.getRandomValues(new Uint8Array(n)); for (const x of b) s += ALPHA[x % ALPHA.length]; return s; };
const cleanName = s => String(s || "").replace(/\s+/g, " ").trim().slice(0, 16);
const NS = (new URLSearchParams(location.search).get("p") || "").slice(0, 8); /* ?p=2 separa perfis em abas do mesmo navegador */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k + NS)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k + NS, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k + NS); } catch (e) {} }
};
let me = store.get("tf-me");
if (!me || !me.token) { me = { token: rid(12), name: "" }; store.set("tf-me", me); }
function cleanPts(pts) {
  if (!Array.isArray(pts)) return null;
  const out = [];
  for (const q of pts.slice(0, 1500)) {
    if (Array.isArray(q) && q.length === 2 && isFinite(q[0]) && isFinite(q[1])) out.push([Math.min(1, Math.max(0, +q[0])), Math.min(1, Math.max(0, +q[1]))]);
  }
  return out;
}
let wake = null;
async function keepAwake() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && V.screen === "game") keepAwake(); });

/* ================= Estado da tela ================= */
const V = { screen: "home", role: null, code: "", pub: null, priv: null, live: null, err: "", status: "", showCard: false, peek: false };
let peer = null, hostConn = null, lastHost = 0;

/* ================= Anfitrião (dono da partida) ================= */
let G = null;
const conns = {}, lastSeen = {};
let lastOnlineSig = "", hostLoop = null, hostRetries = 0;

function newG(code) {
  return {
    code, hostId: me.token, phase: "lobby",
    players: [{ id: me.token, name: me.name, color: COLORS[0], score: 0 }],
    category: "Aleatória", rounds: 2, roundNo: 0,
    part: [], cat: "", word: "", impostor: null, order: [], turn: 0, strokes: [],
    ready: {}, votes: {}, accused: null, guess: "", outcome: "", tie: false
  };
}
function isOn(id) { return id === G.hostId || (!!conns[id] && conns[id].open && Date.now() - (lastSeen[id] || 0) < 15000); }
function freeColor() { return COLORS.find(c => !G.players.some(p => p.color === c)) || pick(COLORS); }
function pubFor(id) {
  const done = G.phase === "result";
  return {
    pub: {
      code: G.code, hostId: G.hostId, phase: G.phase,
      players: G.players.map(p => ({ id: p.id, name: p.name, color: p.color, score: p.score, online: isOn(p.id) })),
      part: G.part, category: G.category, rounds: G.rounds, roundNo: G.roundNo, cat: G.cat,
      order: G.order, turn: G.turn, strokes: G.strokes,
      ready: Object.keys(G.ready), voted: Object.keys(G.votes),
      impostor: (G.phase === "guess" || done) ? G.impostor : null,
      result: done ? { word: G.word, votes: G.votes, outcome: G.outcome, guess: G.guess, accused: G.accused } : null
    },
    priv: (G.phase !== "lobby" && G.part.includes(id)) ? { imp: id === G.impostor, word: id === G.impostor ? null : G.word } : null
  };
}
function send(conn, m) { try { if (conn && conn.open) conn.send(m); } catch (e) {} }
function broadcast() {
  store.set("tf-host", { G, savedAt: Date.now() });
  lastOnlineSig = G.players.map(p => isOn(p.id) ? 1 : 0).join("");
  for (const id in conns) send(conns[id], { t: "state", ...pubFor(id) });
  const mine = pubFor(G.hostId); receive(mine.pub, mine.priv);
}
function onlinePart() { return G.part.filter(isOn); }

function startRound() {
  const part = G.players.filter(p => isOn(p.id)).map(p => p.id);
  if (part.length < 3) return false;
  G.part = part;
  G.cat = G.category === "Aleatória" ? pick(Object.keys(WORDS)) : G.category;
  G.word = pick(WORDS[G.cat]);
  G.impostor = pick(part);
  const base = shuffle(part);
  if (base[0] === G.impostor) base.push(base.shift());
  G.order = []; for (let r = 0; r < G.rounds; r++) G.order.push(...base);
  G.turn = 0; G.strokes = []; G.ready = {}; G.votes = {};
  G.accused = null; G.guess = ""; G.outcome = ""; G.tie = false;
  G.roundNo++; G.phase = "reveal";
  return true;
}
function advanceTurn() { G.turn++; if (G.turn >= G.order.length) G.phase = "discuss"; }
function checkReady() { if (G.phase === "reveal" && onlinePart().every(id => G.ready[id])) G.phase = "draw"; }
function checkVotes() { if (G.phase === "vote" && onlinePart().every(id => G.votes[id] != null)) resolveVotes(); }
function resolveVotes() {
  const t = {}; G.part.forEach(id => t[id] = 0);
  Object.values(G.votes).forEach(v => { if (v in t) t[v]++; });
  const max = Math.max(...Object.values(t)), top = Object.keys(t).filter(k => t[k] === max);
  G.tie = top.length > 1; G.accused = G.tie ? null : top[0];
  if (!G.tie && G.accused === G.impostor) { G.phase = "guess"; return; }
  G.outcome = G.tie ? "tie" : "escaped";
  addScore(G.impostor, 2); G.phase = "result";
}
function resolveGuess(text) {
  G.guess = text;
  if (text && norm(text) === norm(G.word)) { G.outcome = "guessed"; addScore(G.impostor, 1); }
  else { G.outcome = "caught"; G.part.forEach(id => { if (id !== G.impostor) addScore(id, 1); }); }
  G.phase = "result";
}
function addScore(id, n) { const p = G.players.find(x => x.id === id); if (p) p.score += n; }

function hostHandle(id, m) {
  if (!m || typeof m !== "object") return;
  const p = G.players.find(x => x.id === id); if (!p) return;
  const isHost = id === G.hostId;
  const drawer = G.order[G.turn];
  switch (m.t) {
    case "live": {
      if (G.phase !== "draw" || drawer !== id) return;
      const msg = { t: "live", by: id, turn: G.turn, pts: m.pts == null ? null : cleanPts(m.pts) };
      for (const cid in conns) if (cid !== id) send(conns[cid], msg);
      if (!isHost) onLive(msg);
      return;
    }
    case "stroke": {
      if (G.phase !== "draw" || drawer !== id || m.turn !== G.turn) return;
      const pts = cleanPts(m.pts); if (!pts || !pts.length) return;
      G.strokes.push({ by: id, color: p.color, pts }); advanceTurn(); break;
    }
    case "ready": if (G.phase !== "reveal" || !G.part.includes(id)) return; G.ready[id] = 1; checkReady(); break;
    case "vote":
      if (G.phase !== "vote" || !G.part.includes(id) || !G.part.includes(m.target) || m.target === id) return;
      G.votes[id] = m.target; checkVotes(); break;
    case "guess":
      if (G.phase !== "guess" || id !== G.impostor || typeof m.text !== "string") return;
      resolveGuess(m.text.slice(0, 40)); break;
    case "settings":
      if (!isHost || G.phase !== "lobby") return;
      if (CATS.includes(m.category)) G.category = m.category;
      if ([1, 2, 3].includes(m.rounds)) G.rounds = m.rounds;
      break;
    case "start": if (!isHost || !["lobby", "result"].includes(G.phase) || !startRound()) return; break;
    case "openVote": if (!isHost || G.phase !== "discuss") return; G.phase = "vote"; G.votes = {}; break;
    case "skip": if (!isHost || G.phase !== "draw") return; advanceTurn(); break;
    case "endVote": if (!isHost || G.phase !== "vote" || !Object.keys(G.votes).length) return; resolveVotes(); break;
    case "endGuess": if (!isHost || G.phase !== "guess") return; resolveGuess(""); break;
    case "forceReady": if (!isHost || G.phase !== "reveal") return; G.phase = "draw"; break;
    case "lobby": if (!isHost) return; G.phase = "lobby"; break;
    case "kick": {
      if (!isHost || G.phase !== "lobby" || m.id === G.hostId) return;
      G.players = G.players.filter(x => x.id !== m.id);
      if (conns[m.id]) { send(conns[m.id], { t: "reject", why: "O anfitrião tirou você da sala." }); const c = conns[m.id]; delete conns[m.id]; setTimeout(() => { try { c.close(); } catch (e) {} }, 300); }
      break;
    }
    case "resetScores": if (!isHost) return; G.players.forEach(x => x.score = 0); G.roundNo = 0; break;
    default: return;
  }
  broadcast();
}

function onConn(conn) {
  let id = null;
  conn.on("data", m => {
    if (!m || typeof m !== "object" || !G) return;
    if (m.t === "hello") {
      const token = String(m.token || "").slice(0, 40), name = cleanName(m.name) || "Jogador";
      if (!token) return;
      let p = G.players.find(x => x.id === token);
      if (!p) {
        if (G.phase !== "lobby") { send(conn, { t: "reject", why: "Essa partida já começou. Peça para o anfitrião voltar ao lobby no fim da rodada e tente de novo." }); return; }
        if (G.players.length >= 10) { send(conn, { t: "reject", why: "A sala está cheia (10 jogadores)." }); return; }
        p = { id: token, name, color: freeColor(), score: 0 }; G.players.push(p);
      } else if (G.phase === "lobby") p.name = name;
      if (conns[token] && conns[token] !== conn) { const old = conns[token]; setTimeout(() => { try { old.close(); } catch (e) {} }, 100); }
      conns[token] = conn; id = token; lastSeen[id] = Date.now();
      broadcast(); return;
    }
    if (!id || conns[id] !== conn) return;
    lastSeen[id] = Date.now();
    if (m.t === "pong") return;
    hostHandle(id, m);
  });
  conn.on("close", () => { if (id && conns[id] === conn) { delete conns[id]; if (G) broadcast(); } });
  conn.on("error", () => {});
}

function hostStart(restore) {
  if (typeof Peer === "undefined") return fail("Não consegui carregar a conexão (PeerJS). Verifique a internet e recarregue a página.");
  V.role = "host"; V.screen = "connecting"; V.err = ""; render();
  const code = restore ? restore.code : rid(4);
  if (peer) { try { peer.destroy(); } catch (e) {} }
  const pr = new Peer(PREFIX + code.toLowerCase(), { debug: 0 });
  peer = pr;
  pr.on("open", () => {
    if (pr !== peer) return;
    hostRetries = 0;
    if (!G || G.code !== code) G = restore || newG(code);
    const meP = G.players.find(x => x.id === me.token); if (meP && me.name && G.phase === "lobby") meP.name = me.name;
    V.code = code; history.replaceState(null, "", "#" + code);
    broadcast();
    if (!hostLoop) hostLoop = setInterval(hostTick, 4000);
  });
  pr.on("connection", onConn);
  pr.on("disconnected", () => setTimeout(() => { try { if (pr === peer && !pr.destroyed) pr.reconnect(); } catch (e) {} }, 1500));
  pr.on("error", err => {
    if (pr !== peer) return;
    if (err.type === "unavailable-id") {
      try { pr.destroy(); } catch (e) {}
      if (!restore) return hostStart(null);
      if (++hostRetries > 20) return fail("Não consegui reabrir a sala " + code + ". Crie uma sala nova.");
      V.status = "Reabrindo a sala " + code + "…"; render();
      setTimeout(() => hostStart(restore), 3000);
    } else if (!pr.open && ["network", "server-error", "socket-error", "socket-closed", "browser-incompatible", "ssl-unavailable"].includes(err.type)) {
      fail("Não consegui conectar ao servidor de salas. Verifique a internet e tente de novo.");
    }
  });
}
function hostTick() {
  if (!G || V.role !== "host") return;
  for (const id in conns) send(conns[id], { t: "ping" });
  const sig = G.players.map(p => isOn(p.id) ? 1 : 0).join("");
  if (sig !== lastOnlineSig) {
    if (G.phase === "reveal") checkReady();
    if (G.phase === "vote") checkVotes();
    broadcast();
  }
}

/* ================= Convidado ================= */
let joinWatch = null, everJoined = false, lastRetry = 0;
function joinRoom(code) {
  if (typeof Peer === "undefined") return fail("Não consegui carregar a conexão (PeerJS). Verifique a internet e recarregue a página.");
  V.role = "guest"; V.code = code; V.screen = "connecting"; V.err = ""; everJoined = false; render();
  if (peer) { try { peer.destroy(); } catch (e) {} }
  const pr = new Peer({ debug: 0 });
  peer = pr;
  pr.on("open", () => { if (pr === peer) connectHost(); });
  pr.on("disconnected", () => setTimeout(() => { try { if (pr === peer && !pr.destroyed) pr.reconnect(); } catch (e) {} }, 1500));
  pr.on("error", err => {
    if (pr !== peer) return;
    if (err.type === "peer-unavailable") {
      if (!everJoined) fail("Não achei a sala " + code + ". Confira o código ou peça um link novo para quem criou.");
      else { V.status = "O anfitrião sumiu. Tentando reconectar…"; render(); }
    } else if (!pr.open && ["network", "server-error", "socket-error", "socket-closed", "browser-incompatible", "ssl-unavailable"].includes(err.type)) {
      fail("Não consegui conectar ao servidor de salas. Verifique a internet e tente de novo.");
    }
  });
  if (!joinWatch) joinWatch = setInterval(guestTick, 3000);
}
function connectHost() {
  if (!peer || !peer.open) return;
  if (hostConn) { const old = hostConn; hostConn = null; try { old.close(); } catch (e) {} }
  const c = peer.connect(PREFIX + V.code.toLowerCase(), { reliable: true });
  hostConn = c; lastRetry = Date.now();
  c.on("open", () => { if (c !== hostConn) return; lastHost = Date.now(); c.send({ t: "hello", token: me.token, name: me.name }); });
  c.on("data", m => {
    if (c !== hostConn || !m || typeof m !== "object") return;
    lastHost = Date.now();
    if (m.t === "state") { everJoined = true; store.set("tf-last", { code: V.code, at: Date.now() }); receive(m.pub, m.priv); }
    else if (m.t === "live") onLive(m);
    else if (m.t === "ping") send(c, { t: "pong" });
    else if (m.t === "reject") { store.del("tf-last"); fail(m.why || "Não deu para entrar na sala."); }
  });
  c.on("close", () => { if (c === hostConn && V.role === "guest" && V.screen === "game") { V.status = "Conexão perdida. Reconectando…"; render(); } });
  c.on("error", () => {});
}
function guestTick() {
  if (V.role !== "guest" || V.screen === "error" || V.screen === "home") return;
  const quiet = Date.now() - lastHost > 12000;
  if (V.screen === "game" && quiet && !V.status) { V.status = "Conexão perdida. Reconectando…"; render(); }
  if ((quiet || !hostConn || !hostConn.open) && Date.now() - lastRetry > 6000) {
    if (peer && peer.open) connectHost();
    else if (peer && peer.disconnected && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} }
    if (V.screen === "connecting" && !everJoined && Date.now() - lastRetry > 0) { /* segue tentando */ }
  }
}

/* ================= Ações do jogador ================= */
function act(m) {
  if (V.role === "host" && G) hostHandle(me.token, m);
  else if (hostConn && hostConn.open) send(hostConn, m);
}
function leave() {
  if (V.role === "host") store.del("tf-host");
  store.del("tf-last");
  try { if (peer) peer.destroy(); } catch (e) {}
  peer = null; hostConn = null; G = null; for (const k in conns) delete conns[k];
  V.role = null; V.pub = null; V.priv = null; V.screen = "home"; V.status = ""; V.err = "";
  history.replaceState(null, "", location.pathname + location.search);
  render();
}
function fail(msg) { V.screen = "error"; V.err = msg; V.status = ""; render(); }

function receive(pub, priv) {
  const prev = V.pub;
  if (!prev || prev.phase !== pub.phase || prev.roundNo !== pub.roundNo) { V.showCard = false; V.peek = false; V.live = null; }
  else if (prev.turn !== pub.turn) V.live = null;
  V.pub = pub; V.priv = priv; V.screen = "game"; V.status = "";
  render();
}
function onLive(m) {
  const p = V.pub; if (!p || p.phase !== "draw" || m.turn !== p.turn || p.order[p.turn] !== m.by || m.by === me.token) return;
  V.live = m.pts;
  const cv = $("cv"); if (cv) drawScene(cv, p.strokes, V.live ? { color: player(m.by).color, pts: V.live } : null);
}

/* ================= Desenho ================= */
function drawScene(cv, strokes, cur) {
  const rect = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(rect.width * dpr)), h = Math.max(1, Math.round(rect.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const g = cv.getContext("2d");
  g.fillStyle = "#fdfdfb"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "#e6ebf2"; g.lineWidth = dpr;
  const step = w / 20; g.beginPath();
  for (let k = 1; k < 20; k++) { g.moveTo(k * step, 0); g.lineTo(k * step, h); g.moveTo(0, k * step); g.lineTo(w, k * step); }
  g.stroke();
  g.lineCap = "round"; g.lineJoin = "round";
  for (const s of cur ? strokes.concat([cur]) : strokes) {
    if (!s || !s.pts || !s.pts.length) continue;
    g.strokeStyle = s.color; g.lineWidth = w * 0.011; g.beginPath();
    s.pts.forEach(([x, y], k) => k ? g.lineTo(x * w, y * h) : g.moveTo(x * w, y * h));
    if (s.pts.length === 1) g.lineTo(s.pts[0][0] * w + 0.1, s.pts[0][1] * h);
    g.stroke();
  }
}
let myCur = null, myPending = false, myTurnKey = "", liveTimer = null, sentStroke = false;
function sendLiveSoon() {
  if (liveTimer) return;
  liveTimer = setTimeout(() => { liveTimer = null; act({ t: "live", pts: myCur ? myCur.pts : null }); }, 60);
}

/* ================= Telas ================= */
const player = id => (V.pub && V.pub.players.find(p => p.id === id)) || { name: "?", color: "#999", online: false };
const amHost = () => V.role === "host";
let lastKey = null;
function stableKey() {
  const p = V.pub;
  if (V.screen !== "game" || !p) return null;
  if (p.phase === "draw") { const d = player(p.order[p.turn]); return `draw|${p.roundNo}|${p.turn}|${d.online}|${V.peek}`; }
  if (p.phase === "guess" && V.priv && V.priv.imp) return `guess|${p.roundNo}`;
  return null;
}
function render() {
  const b = $("banner"); b.textContent = V.status; b.hidden = !V.status;
  const k = stableKey();
  if (k && k === lastKey) { const cv = $("cv"); if (cv && V.pub.phase === "draw") redrawGame(cv); return; }
  lastKey = k;
  const st = $("status");
  if (V.screen === "home") { st.textContent = "Cada um no seu celular"; return vHome(); }
  if (V.screen === "connecting") { st.textContent = "Conectando"; return vConnecting(); }
  if (V.screen === "error") { st.textContent = "Ops"; return vError(); }
  st.textContent = "Sala " + V.pub.code + (amHost() ? " · você é o anfitrião" : "");
  ({ lobby: vLobby, reveal: vReveal, draw: vDraw, discuss: vDiscuss, vote: vVote, guess: vGuess, result: vResult })[V.pub.phase]();
}
function redrawGame(cv) {
  const p = V.pub, did = p.order[p.turn];
  const cur = did === me.token ? myCur : (V.live ? { color: player(did).color, pts: V.live } : null);
  drawScene(cv, p.strokes, cur);
}
function bindCanvasStatic() {
  const cv = $("cv"); if (!cv) return;
  drawScene(cv, V.pub.strokes);
}
window.addEventListener("resize", () => { const cv = $("cv"); if (cv && V.pub) { if (V.pub.phase === "draw") redrawGame(cv); else drawScene(cv, V.pub.strokes); } });

    const hint = $("hint"), actions = $("actions");
    let drawing = false;
    const pt = e => { const r = cv.getBoundingClientRect(); return [Math.round(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * 1000) / 1000, Math.round(Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) * 1000) / 1000]; };
    cv.addEventListener("pointerdown", e => {
      if (myPending || sentStroke) return;
      e.preventDefault(); drawing = true; try { cv.setPointerCapture(e.pointerId); } catch (x) {}
      myCur = { color: d.color, pts: [pt(e)] }; hint.hidden = true; redrawGame(cv); sendLiveSoon();
    });
    cv.addEventListener("pointermove", e => {
      if (!drawing) return;
      const q = pt(e), l = myCur.pts[myCur.pts.length - 1];
      if (Math.hypot(q[0] - l[0], q[1] - l[1]) > 0.003 && myCur.pts.length < 1500) { myCur.pts.push(q); redrawGame(cv); sendLiveSoon(); }
    });
    const end = () => { if (!drawing) return; drawing = false; myPending = true; actions.hidden = false; };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
    $("redo").onclick = () => { myCur = null; myPending = false; actions.hidden = true; hint.hidden = false; clearTimeout(liveTimer); liveTimer = null; act({ t: "live", pts: null }); redrawGame(cv); };
    $("ok").onclick = () => {
      if (!myCur || sentStroke) return;
      sentStroke = true; clearTimeout(liveTimer); liveTimer = null;
      $("ok").disabled = true; $("redo").disabled = true;
      act({ t: "stroke", turn: p.turn, pts: myCur.pts });
    };
  }
  redrawGame(cv);
}

function vDiscuss() {
  const p = V.pub;
  app.innerHTML = `
  <section class="sheet">
    <h2>Desenho pronto. Quem estava fingindo?</h2>
    <div class="canvas-box"><canvas id="cv" aria-label="Desenho final"></canvas></div>
    <p class="muted">Conversem sobre cada traço. ${amHost() ? "Quando estiverem prontos, abra a votação." : "O anfitrião abre a votação quando todos estiverem prontos."}</p>
    ${partChips()}
    ${amHost() ? `<button class="btn primary wide" id="go">Abrir votação</button>` : ""}
    ${V.priv ? `<button class="btn ghost small" id="peek" style="align-self:flex-start">${V.peek ? "Esconder minha palavra" : "Ver minha palavra"}</button>${V.peek ? secretCard(true) : ""}` : ""}
  </section>`;
  bindCanvasStatic();
  if ($("go")) $("go").onclick = () => act({ t: "openVote" });
  if ($("peek")) $("peek").onclick = () => { V.peek = !V.peek; render(); };
}

function vVote() {
  const p = V.pub, voted = p.voted.includes(me.token), inRound = p.part.includes(me.token);
  const missing = p.part.filter(id => player(id).online && !p.voted.includes(id)).length;
  app.innerHTML = `
  <section class="sheet">
    ${inRound && !voted ? `
      <h2>Quem é o impostor?</h2>
      <p class="muted">Seu voto é secreto.</p>
      <div class="vote-list">${p.part.filter(id => id !== me.token).map(id => { const x = player(id); return `<button data-v="${esc(id)}">${dot(x.color)}<span class="n">${esc(x.name)}</span></button>`; }).join("")}</div>`
    : `<h2>${inRound ? "Voto enviado" : "Votação em andamento"}</h2><p class="wait">Esperando ${missing} ${missing === 1 ? "pessoa" : "pessoas"} votar…</p>`}
    ${partChips(p.voted)}
    <div class="canvas-box"><canvas id="cv" aria-label="Desenho final"></canvas></div>
    ${amHost() && p.voted.length > 0 && missing > 0 ? `<button class="btn ghost small" id="end">Encerrar votação agora</button>` : ""}
  </section>`;
  bindCanvasStatic();
  app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { app.querySelectorAll("[data-v]").forEach(x => x.disabled = true); act({ t: "vote", target: b.dataset.v }); });
  if ($("end")) $("end").onclick = () => act({ t: "endVote" });
}

function vGuess() {
  const p = V.pub, imp = player(p.impostor), mine = V.priv && V.priv.imp;
  app.innerHTML = `
  <section class="sheet">
    <span class="tag">Pegaram!</span>
    <h2>${mine ? "Você era o impostor e foi descoberto." : `<span style="color:${imp.color}">${esc(imp.name)}</span> era o impostor.`}</h2>
    ${mine ? `
      <p class="muted">Última chance: qual era a palavra? Categoria: <b>${esc(p.cat)}</b>.</p>
      <form class="stack" id="gf">
        <input class="field" id="guess-input" autocomplete="off" placeholder="Digite seu chute" aria-label="Seu chute">
        <button class="btn primary wide" type="submit">Chutar</button>
      </form>`
    : `<p class="wait">${esc(imp.name)} está tentando adivinhar a palavra…</p>`}
    <div class="canvas-box"><canvas id="cv" aria-label="Desenho final"></canvas></div>
    ${amHost() && !mine && !imp.online ? `<button class="btn ghost small" id="endg">${esc(imp.name)} saiu. Encerrar rodada</button>` : ""}
  </section>`;
  bindCanvasStatic();
  if ($("gf")) $("gf").onsubmit = e => {
    e.preventDefault(); const g = $("guess-input").value.trim(); if (!g) return;
    e.target.querySelector("button").disabled = true; act({ t: "guess", text: g });
  };
  if ($("endg")) $("endg").onclick = () => act({ t: "endGuess" });
}

function vResult() {
  const p = V.pub, r = p.result, imp = player(p.impostor), n = esc(imp.name);
  const youImp = p.impostor === me.token;
  const t = {}; p.part.forEach(id => t[id] = 0); Object.values(r.votes).forEach(v => { if (v in t) t[v]++; });
  const msg = {
    escaped: [`${youImp ? "Você" : n} escapou!`, "win-imp", `O grupo votou em <b>${esc(player(r.accused).name)}</b>. ${n} ganha 2 pontos.`],
    tie: [`Empate. ${youImp ? "Você" : n} escapou!`, "win-imp", `Os votos ficaram divididos. ${n} ganha 2 pontos.`],
    guessed: [`${n} foi pego, mas acertou a palavra!`, "win-imp", `Chute: “${esc(r.guess)}”. ${n} ganha 1 ponto.`],
    caught: ["Os artistas venceram!", "win-art", r.guess ? `${n} chutou “${esc(r.guess)}” e errou. Cada artista ganha 1 ponto.` : `${n} não chutou. Cada artista ganha 1 ponto.`]
  }[r.outcome];
  app.innerHTML = `
  <section class="sheet">
    <div class="verdict ${msg[1]}">${msg[0]}</div>
    <p>${msg[2]}</p>
    <div class="card"><span class="tag">A palavra era · ${esc(p.cat)}</span><div class="word">${esc(r.word)}</div><p class="muted">Impostor: <b style="color:${imp.color}">${n}</b></p></div>
    <div class="canvas-box"><canvas id="cv" aria-label="Desenho da rodada"></canvas></div>
    <p class="tally">Votos: ${p.part.map(id => `${esc(player(id).name)} ${t[id]}`).join(" · ")}</p>
    ${amHost() ? `<div class="row">
      <button class="btn primary" id="again" style="flex:1">Próxima rodada</button>
      <button class="btn ghost" id="lobby">Voltar ao lobby</button></div>
      <p class="muted">No lobby você muda a categoria e novas pessoas podem entrar.</p>`
    : `<p class="wait">Esperando o anfitrião começar a próxima rodada…</p>`}
  </section>
  ${scoreTable()}`;
  bindCanvasStatic(); bindScore();
  if ($("again")) $("again").onclick = () => act({ t: "start" });
  if ($("lobby")) $("lobby").onclick = () => act({ t: "lobby" });
}

/* ================= Início ================= */
(function boot() {
  const hashCode = (location.hash.slice(1) || "").toUpperCase();
  const last = store.get("tf-last");
  const saved = store.get("tf-host");
  if (/^[A-Z0-9]{4}$/.test(hashCode) && me.name) {
    if (saved && saved.G && saved.G.code === hashCode && saved.G.hostId === me.token && Date.now() - saved.savedAt < 6 * 3600e3) { G = saved.G; return hostStart(saved.G); }
    if (last && last.code === hashCode && Date.now() - last.at < 6 * 3600e3) return joinRoom(hashCode);
  }
  render();
})();
</script>
